name: Use a job keychain
description: >-
  Give a Darkbloom job its own unlocked default keychain. A Darkbloom VM's
  login keychain can be locked, and its image has no login password to unlock
  it with, so a write there fails with errSecInteractionNotAllowed. fx and its
  Keychain tests use the user's default keychain. Other runners keep theirs.

runs:
  using: composite
  steps:
    - name: Use a job keychain
      if: ${{ startsWith(runner.name, 'darkbloom-') }}
      shell: bash
      run: |
        set -euo pipefail
        keychain="$RUNNER_TEMP/fx-ci.keychain-db"
        password="$(uuidgen)"
        security create-keychain -p "$password" "$keychain"
        security set-keychain-settings "$keychain"
        security unlock-keychain -p "$password" "$keychain"
        security list-keychains -d user -s "$keychain"
        security default-keychain -d user -s "$keychain"
        security default-keychain -d user
