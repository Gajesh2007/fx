name: macOS

# Linux CI covers everything that behaves the same on every platform. These
# checks run only for changes that can behave differently on macOS; see
# scripts/detect-macos-need.sh. Add the ci:macos label or dispatch this
# workflow to request them for any other change.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      sdk_native:
        description: Also build and load the libfx Node-API addon
        type: boolean
        default: false

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect macOS need
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.detect.outputs.needed }}
      sdk_native: ${{ steps.detect.outputs.sdk_native }}
    steps:
      # A dispatch diffs the branch against main, so it runs at least the checks
      # its pull request run would.
      - uses: actions/checkout@v4
        with:
          # 0 is falsy in expressions, so the dispatch case must come last.
          fetch-depth: ${{ github.event_name != 'workflow_dispatch' && 2 || 0 }}

      - name: Decide whether this change needs macOS
        id: detect
        env:
          MACOS_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && 'manual dispatch' || (contains(github.event.pull_request.labels.*.name, 'ci:macos') && 'ci:macos label' || '') }}
          SDK_NATIVE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.sdk_native || false }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            base="$(git merge-base origin/main HEAD)"
            scripts/detect-macos-need.sh "$base" HEAD
          else
            # The pull request merge commit's first parent is the base branch.
            scripts/detect-macos-need.sh HEAD^1 HEAD
          fi

  prepare-tools:
    name: Prepare macOS tools
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch the macOS compiler
        uses: ./.github/actions/fetch-macos-zig

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Package the E2E dependencies
        working-directory: tests/e2e
        run: |
          bun install --frozen-lockfile
          tar -czf "$RUNNER_TEMP/fx-e2e-deps.tar.gz" node_modules

      - uses: actions/upload-artifact@v4
        with:
          name: fx-macos-e2e-deps
          path: ${{ runner.temp }}/fx-e2e-deps.tar.gz
          retention-days: 1
          if-no-files-found: error

  route:
    name: Route macOS jobs
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    uses: ./.github/workflows/darkbloom-route.yml
    permissions: {}
    with:
      # DARKBLOOM_REQUIRE=on fails runner selection instead of falling back.
      require-darkbloom: ${{ vars.DARKBLOOM_REQUIRE == 'on' }}
      lanes: |
        macos-unit macos_arm64 macos-15
        macos-build macos_arm64 macos-15
        macos-e2e macos_arm64 macos-15 8
        macos-store-lock macos_arm64 macos-15

  unit:
    name: macOS arm64 unit tests
    needs: [detect, prepare-tools, route]
    if: needs.detect.outputs.needed == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['macos-unit'] }}
    timeout-minutes: 60
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: ./.github/actions/setup-macos-zig

      - name: Test signing and release routing
        run: python3 -m unittest scripts.tests.test_macos_signing scripts.tests.test_signed_macos -q

      - name: Run unit tests
        run: zig build test -Doptimize=ReleaseSafe --summary all

  build:
    name: macOS arm64 build
    needs: [detect, prepare-tools, route]
    if: needs.detect.outputs.needed == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['macos-build'] }}
    timeout-minutes: 30
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: ./.github/actions/setup-macos-zig

      # The E2E shards run this binary on other runners, so build for the
      # baseline CPU rather than the build runner's.
      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline

      - name: Smoke test fresh binary
        run: |
          sw_vers
          scripts/smoke-binary.sh zig-out/bin/fx

      - name: Share the binary with the E2E shards
        uses: actions/upload-artifact@v4
        with:
          name: fx-macos-arm64
          path: zig-out/bin/fx
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: macOS arm64 platform E2E (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [detect, prepare-tools, route, build]
    if: needs.detect.outputs.needed == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['macos-e2e'] }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
      FX_REQUIRE_TMUX: "1"
      SHARD_NUMBER: ${{ matrix.shard }}
      SHARD_COUNT: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the shared binary
        uses: actions/download-artifact@v4
        with:
          name: fx-macos-arm64
          path: zig-out/bin

      - name: Restore the executable bit
        run: chmod +x zig-out/bin/fx

      # Some E2E fixtures build small Zig helpers.
      - name: Setup Zig
        uses: ./.github/actions/setup-macos-zig

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-darwin-aarch64.zip
          no-cache: true

      - name: Install E2E system dependencies
        run: |
          set -euo pipefail
          if ! command -v tmux >/dev/null 2>&1; then
            tools="$RUNNER_TEMP/fx-e2e-tools"
            mkdir -p "$tools"
            curl -fsSL --retry 2 \
              https://github.com/tmux/tmux-builds/releases/download/v3.8/tmux-3.8-macos-arm64.tar.gz \
              -o "$tools/tmux.tar.gz"
            echo 'ec926bbf28ddf55d0dc7c9791d43e03e251ddab392d763f7fbb38d4b8408d051  tmux.tar.gz' |
              (cd "$tools" && shasum -a 256 -c -)
            tar -xzf "$tools/tmux.tar.gz" -C "$tools"
            export PATH="$tools:$PATH"
            printf '%s\n' "$tools" >> "$GITHUB_PATH"
          fi
          printf 'set-option -g history-limit 100000\n' > "$HOME/.tmux.conf"
          tmux -V
          zsh --version

      - uses: actions/download-artifact@v4
        with:
          name: fx-macos-e2e-deps
          path: ${{ runner.temp }}/fx-e2e-deps

      - name: Restore E2E dependencies
        run: tar -xzf "$RUNNER_TEMP/fx-e2e-deps/fx-e2e-deps.tar.gz" -C tests/e2e

      - name: Run this shard of the macOS platform E2E files
        working-directory: tests/e2e
        shell: bash
        run: |
          bun ci-shards.ts --shard-count "$SHARD_COUNT" --shard-index "$((SHARD_NUMBER - 1))" \
            --only macos-platform-tests.json > "$RUNNER_TEMP/fx-macos-shard.txt"
          files=()
          while IFS= read -r test_file; do
            files+=("$test_file")
          done < "$RUNNER_TEMP/fx-macos-shard.txt"
          test "${#files[@]}" -gt 0
          printf 'Running %s macOS platform E2E files:\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          ./ci-run-files.sh "${files[@]}"

      - name: Setup Node
        if: needs.detect.outputs.sdk_native == 'true' && matrix.shard == 1
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build and load the native SDK addon
        if: needs.detect.outputs.sdk_native == 'true' && matrix.shard == 1
        run: |
          zig build libfx-napi -Dnapi-surface=core -Doptimize=ReleaseSafe
          npm run --prefix sdk test:node-napi

  # Real fx processes take the MCP credential store's lock on the macOS
  # Keychain, slowed, frozen, and killed, and TLC checks each run against
  # tests/tla/mcp_host/StoreLockBudget.tla. Linux CI runs the other MCP host
  # drivers; this one needs the Keychain.
  store-lock:
    name: macOS arm64 MCP store lock driver
    needs: [detect, prepare-tools, route, build]
    if: needs.detect.outputs.needed == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['macos-store-lock'] }}
    timeout-minutes: 30
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the shared binary
        uses: actions/download-artifact@v4
        with:
          name: fx-macos-arm64
          path: zig-out/bin

      - name: Restore the executable bit
        run: chmod +x zig-out/bin/fx

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-darwin-aarch64.zip
          no-cache: true

      - name: Set up Temurin 21
        run: |
          set -euo pipefail
          jdk_dir="$RUNNER_TEMP/fx-temurin"
          mkdir -p "$jdk_dir"
          curl -fsSL --retry 2 --max-time 120 \
            https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_aarch64_mac_hotspot_21.0.13_9.tar.gz \
            -o "$jdk_dir/jdk.tar.gz"
          echo 'bf036b35b071bfb2f54f2c0af8ee8d88afa95ee6eb3dce02c0f94cfc2524d04a  jdk.tar.gz' |
            (cd "$jdk_dir" && shasum -a 256 -c -)
          tar -xzf "$jdk_dir/jdk.tar.gz" --strip-components=1 -C "$jdk_dir"
          java_home="$jdk_dir/Contents/Home"
          "$java_home/bin/java" -version
          printf 'JAVA_HOME=%s\n' "$java_home" >> "$GITHUB_ENV"
          printf '%s\n' "$java_home/bin" >> "$GITHUB_PATH"

      - name: Drive the Keychain store's lock along the model
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | shasum -a 256 -c -
          export TLA2TOOLS_JAR="$jar"
          bun test ./tests/tla/drivers/mcp_host/store-lock-budget.test.ts

  macos:
    name: macOS arm64
    if: ${{ always() }}
    needs: [detect, unit, build, e2e, store-lock]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require macOS results when the change needs them
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          NEEDED: ${{ needs.detect.outputs.needed }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          STORE_LOCK_RESULT: ${{ needs.store-lock.result }}
        run: |
          test "$DETECT_RESULT" = success
          if [ "$NEEDED" != true ]; then
            echo "No macOS-specific change; nothing to require."
            exit 0
          fi
          test "$UNIT_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$E2E_RESULT" = success
          test "$STORE_LOCK_RESULT" = success
